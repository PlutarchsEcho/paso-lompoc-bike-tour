<title>Paso Robles → Lompoc Bike Tour</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css">
<style>
  :root{--bg:#f7f6f3;--fg:#1d1d1f;--mut:#6b6b70;--card:#fff;--bd:#dedcd6;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#16171a;--fg:#ececef;--mut:#9c9ca3;--card:#1f2024;--bd:#33343a;color-scheme:dark}}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
  header{padding:10px 14px;border-bottom:1px solid var(--bd);background:var(--card);flex:0 0 auto}
  h1{margin:0;font-size:16px;letter-spacing:-.01em}
  header p{margin:3px 0 0;font-size:12px;color:var(--mut)}
  #wrap{flex:1 1 auto;display:flex;min-height:0}
  #side{width:310px;flex:0 0 auto;overflow-y:auto;background:var(--card);
        border-right:1px solid var(--bd);padding:10px}
  #map{flex:1 1 auto;min-width:0}
  .day{border:1px solid var(--bd);border-radius:9px;padding:9px 10px;margin-bottom:8px;background:var(--bg)}
  .day.off{opacity:.45}
  .row{display:flex;align-items:center;gap:8px}
  .sw{width:13px;height:13px;border-radius:3px;flex:0 0 auto}
  .dt{font-weight:650;font-size:13px}
  .dd{font-size:11.5px;color:var(--mut);margin:5px 0 7px;line-height:1.35}
  .st{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut)}
  .st b{color:var(--fg);font-weight:650}
  .btns{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
  button{font:inherit;font-size:11.5px;padding:3px 9px;border:1px solid var(--bd);
         border-radius:6px;background:var(--card);color:var(--fg);cursor:pointer}
  button:hover{border-color:var(--mut)}
  .tot{margin-top:4px;padding:9px 10px;border-radius:9px;background:var(--bg);border:1px dashed var(--bd);font-size:12px}
  .tot b{font-size:15px}
  .hint{font-size:11px;color:var(--mut);margin-top:9px;line-height:1.4}
  .leaflet-popup-content{font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .pin{font-size:11px;font-weight:700;color:#fff;background:#111;border-radius:50%;
       width:20px;height:20px;display:flex;align-items:center;justify-content:center;
       border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
  details.sect{border:1px solid var(--bd);border-radius:9px;margin:0 0 9px;background:var(--bg)}
  details.sect>summary{list-style:none;cursor:pointer;padding:9px 10px;font-size:13px;font-weight:650;
                       display:flex;align-items:center;gap:7px;user-select:none}
  details.sect>summary::-webkit-details-marker{display:none}
  details.sect>summary::before{content:'\25b8';font-size:11px;opacity:.6;transition:transform .15s}
  details.sect[open]>summary::before{transform:rotate(90deg)}
  details.sect>summary:hover{background:var(--card);border-radius:9px}
  details.sect>summary .cnt{margin-left:auto;font-size:11px;font-weight:400;color:var(--mut)}
  details.sect .inner{padding:0 10px 9px}
  #climbs,#grades{border:1px solid var(--bd);border-radius:9px;padding:9px 10px;margin:0 0 9px;background:var(--bg)}
  #climbs h2,#grades h2{margin:0 0 3px;font-size:13px;font-weight:650}
  .cnote{font-size:10.5px;color:var(--mut);margin-bottom:7px}
  .climb{display:flex;gap:7px;align-items:flex-start;padding:5px 6px;border-radius:6px;cursor:pointer}
  .climb:hover{background:var(--card)}
  .cbar{width:4px;align-self:stretch;border-radius:2px;flex:0 0 auto;min-height:26px}
  .cname{font-size:12px;font-weight:600}
  .cmeta{font-size:11px;color:var(--mut);font-variant-numeric:tabular-nums}
  #photos{border:1px solid var(--bd);border-radius:9px;padding:9px 10px;margin:0 0 9px;background:var(--bg)}
  #photos h2{margin:0 0 7px;font-size:13px;font-weight:650}
  #drop{border:1.5px dashed var(--bd);border-radius:8px;padding:14px 8px;text-align:center;
        font-size:11.5px;color:var(--mut);cursor:pointer;transition:border-color .15s,background .15s}
  #drop:hover,#drop.hot{border-color:#2e8b57;background:rgba(46,139,87,.07);color:var(--fg)}
  #plock{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  #plock input{font:inherit;font-size:12px;padding:4px 8px;border:1px solid var(--bd);
               border-radius:6px;background:var(--card);color:var(--fg);width:120px}
  #pmsg{font-size:11px;color:#b00020;margin-top:5px;min-height:14px;width:100%}
  #pnote{font-size:10.5px;color:var(--mut);margin-top:6px;line-height:1.4}
  #pstat{font-size:11.5px;color:var(--mut);margin-top:7px;line-height:1.45}
  #pstat b{color:var(--fg)}
  .dev{margin-top:6px;padding:6px 8px;border-radius:6px;font-size:11px;line-height:1.4;
       background:rgba(176,0,32,.09);border:1px solid rgba(176,0,32,.3)}
  .dev.ok{background:rgba(46,139,87,.09);border-color:rgba(46,139,87,.35)}
  .pthumb{width:150px;display:block;border-radius:4px;margin-bottom:5px}
  .pclust{display:flex;align-items:center;justify-content:center;border-radius:50%;
          color:#fff;font-weight:700;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  .gal{max-width:300px}
  .gal h4{margin:0 0 6px;font-size:13px}
  .galgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:5px;
           max-height:260px;overflow-y:auto}
  .galcell{text-align:center;font-size:9.5px;line-height:1.25;color:#555}
  .galcell img{width:100%;border-radius:4px;display:block;cursor:pointer}
  .galbig img{max-width:280px;border-radius:5px;display:block;margin-bottom:5px}
  .pmark{width:13px;height:13px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.5)}
  @media (max-width:760px){#wrap{flex-direction:column}
    #side{width:auto;max-height:42vh;border-right:0;border-bottom:1px solid var(--bd)}
    #map{min-height:52vh}}
</style>

var climbLayer = L.layerGroup().addTo(map);
function climbColor(mx){ return mx>=12 ? '#7a0012' : (mx>=9 ? '#c2185b' : '#e07a00'); }
function climbPopup(c){
  return '<b>'+c.name+'</b><br>'+DAYS[c.day].title.split(' \u00b7')[0]+
    ' \u00b7 mile '+c.startMi.toFixed(1)+'\u2013'+c.endMi.toFixed(1)+
    '<br>whole climb: '+c.lenMi.toFixed(2)+' mi \u00b7 '+c.gainFt+' ft \u00b7 avg '+c.avgPct.toFixed(1)+'%'+
    '<br>steepest '+c.steep.lenMi.toFixed(2)+' mi: <b>'+c.steep.pct.toFixed(1)+'%</b>'+
    '<br>max 0.1 mi pitch: '+c.maxPct.toFixed(1)+'%';
}
CLIMBS.forEach(function(c, i){
  c._pl = L.polyline(c.line, {color:climbColor(c.maxPct), weight:6, opacity:.75})
            .bindPopup(climbPopup(c)).addTo(climbLayer);
  c._st = L.polyline(c.steep.line, {color:'#000', weight:9, opacity:.85})
            .bindPopup('<b>Steepest pitch \u2014 '+c.name+'</b><br>'+
                       c.steep.lenMi.toFixed(2)+' mi at <b>'+c.steep.pct.toFixed(1)+'%</b><br>'+
                       c.steep.gainFt+' ft, mile '+c.steep.startMi.toFixed(1)+'\u2013'+c.steep.endMi.toFixed(1))
            .addTo(climbLayer);
});
var gradeLayer = L.layerGroup().addTo(map);
function gradeColor(a){ return a>=4 ? '#ffc94d' : '#ffe28a'; }
function gradePopup(c){
  return '<b>Long grade</b><br>'+DAYS[c.day].title.split(' \u00b7')[0]+
    ' \u00b7 mile '+c.startMi.toFixed(1)+'\u2013'+c.endMi.toFixed(1)+
    '<br>'+c.lenMi.toFixed(2)+' mi \u00b7 '+c.gainFt+' ft gain'+
    '<br><b>avg '+c.avgPct.toFixed(1)+'%</b> \u00b7 max '+c.maxPct.toFixed(1)+'%';
}
GRADES.forEach(function(c, i){
  c._pl = L.polyline(c.line, {color:gradeColor(c.avgPct), weight:6, opacity:.75})
            .bindPopup(gradePopup(c)).addTo(gradeLayer);
});
function showGrade(i){
  var c = GRADES[i];
  if (!map.hasLayer(layers[c.day])) setVisible(c.day, true);
  map.fitBounds(L.latLngBounds(c.line).pad(0.35));
  c._pl.openPopup();
}
function showClimb(i){
  var c = CLIMBS[i];
  if (!map.hasLayer(layers[c.day])) setVisible(c.day, true);
  map.fitBounds(L.latLngBounds(c.line).pad(0.35));
  c._pl.openPopup();
}

  else { map.removeLayer(layers[i]); btn.textContent = 'Show'; card.classList.add('off'); }
}
// ---------- photo placement ----------
function hav(a, b){
  var R=6371000, r=Math.PI/180;
  var p=a[0]*r, q=b[0]*r, dp=(b[0]-a[0])*r, dl=(b[1]-a[1])*r;
  var x=Math.sin(dp/2)*Math.sin(dp/2)+Math.cos(p)*Math.cos(q)*Math.sin(dl/2)*Math.sin(dl/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
var INDEX = [];
DAYS.forEach(function(d, di){
  var c = 0;
  for (var i=0;i<d.line.length;i++){
    if (i) c += hav(d.line[i-1], d.line[i]);
    INDEX.push({lat:d.line[i][0], lon:d.line[i][1], day:di, mile:c/1609.34});
  }
});
var OFF_M = 75, CL_M = 400, CL_MIN = 45, REJECT_MI = 15, REJECT_M = REJECT_MI * 1609.34;
// tour dates: a photo taken on a day's date is treated as genuine even when well off the line
var DAY_DATES = ['2026-10-08','2026-10-09','2026-10-10','2026-10-11','2026-10-12'];
function localDateStr(d){
  return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
}
function dayFromDate(when){
  if (!when) return -1;
  return DAY_DATES.indexOf(localDateStr(new Date(when)));
}
function nearestOnDay(lat, lon, di){
  var best=Infinity, bm=0;
  for (var i=0;i<INDEX.length;i++){
    if (INDEX[i].day!==di) continue;
    var d=hav([lat,lon],[INDEX[i].lat,INDEX[i].lon]);
    if (d<best){ best=d; bm=INDEX[i].mile; }
  }
  return {dist:best, mile:bm};
}
var photos = [], noGps = 0, rejected = [];
var photoLayer = L.markerClusterGroup({
  maxClusterRadius: 45,
  spiderfyOnMaxZoom: false,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: false,          // clicking opens the gallery instead
  iconCreateFunction: function(cluster){
    var ms = cluster.getAllChildMarkers(), n = ms.length;
    var bad = ms.some(function(m){ return m.options._bad; });
    var size = n < 10 ? 30 : (n < 50 ? 36 : 42);
    return L.divIcon({
      html: '<div class="pclust" style="width:'+size+'px;height:'+size+'px;background:'+
            (bad ? '#b00020' : '#2e8b57')+';font-size:'+(n<100?12:10)+'px">'+n+'</div>',
      className: '', iconSize: [size, size]
    });
  }
}).addTo(map);

function galleryHtml(list){
  var h = '<div class="gal"><h4>'+list.length+' photo'+(list.length>1?'s':'')+' here</h4><div class="galgrid">';
  list.forEach(function(p, i){
    var when = p.time ? new Date(p.time).toLocaleString([], {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'}) : 'no time';
    h += '<div class="galcell">'+
         (p.thumb ? '<img src="'+p.thumb+'" data-gi="'+i+'" title="'+p.name+'">' : '')+
         when+'</div>';
  });
  return h + '</div></div>';
}
var galList = [], galPopup = null;
function openGallery(latlng, list){
  galList = list.slice().sort(function(a,b){ return new Date(a.time||0) - new Date(b.time||0); });
  galPopup = L.popup({maxWidth:320}).setLatLng(latlng).setContent(galleryHtml(galList)).openOn(map);
}
photoLayer.on('clusterclick', function(e){
  openGallery(e.layer.getLatLng(), e.layer.getAllChildMarkers().map(function(m){ return m.options._photo; }));
});
// one delegated listener: survives popup re-renders, no timing race
document.addEventListener('click', function(ev){
  var t = ev.target;
  if (!t || !t.closest) return;
  if (t.closest('.leaflet-popup-content') === null) return;
  var back = t.closest('[data-gback]');
  if (back && galPopup){
    galPopup.setContent(galleryHtml(galList)); galPopup.update(); return;
  }
  var gi = t.getAttribute && t.getAttribute('data-gi');
  if (gi === null || gi === undefined || !galPopup) return;
  var p = galList[+gi];
  if (!p) return;
  galPopup.setContent('<div class="gal galbig">'+
    (p.thumb ? '<img src="'+p.thumb+'">' : '')+
    '<b>'+p.name+'</b><br>'+DAYS[p.day].title.split(' \u00b7')[0]+' \u00b7 mile '+p.mile+
    '<br>'+(p.time ? new Date(p.time).toLocaleString() : 'no timestamp')+
    '<br>'+(p.off > OFF_M ? '<span style="color:#b00020">'+
       (p.off>1609 ? (p.off/1609.34).toFixed(1)+' mi' : p.off+' m')+' off route</span>'
     : p.off+' m from route')+
    '<br><span style="opacity:.65">'+p.camera+'</span>'+
    '<div style="margin-top:6px"><a href="#" data-gback="1">\u2190 back to all '+galList.length+'</a></div></div>');
  galPopup.update();
  ev.preventDefault();
});

function nearest(lat, lon){
  var best = null, bd = Infinity;
  for (var i=0;i<INDEX.length;i++){
    var d = hav([lat,lon],[INDEX[i].lat, INDEX[i].lon]);
    if (d < bd){ bd = d; best = INDEX[i]; }
  }
  return {pt:best, dist:bd};
}
function thumb(file, cb){
  var u = URL.createObjectURL(file), im = new Image();
  im.onload = function(){
    var c = document.createElement('canvas'), m = 150/Math.max(im.width, im.height);
    c.width = Math.round(im.width*m); c.height = Math.round(im.height*m);
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    URL.revokeObjectURL(u);
    try { cb(c.toDataURL('image/jpeg', .7)); } catch(e){ cb(null); }
  };
  im.onerror = function(){ URL.revokeObjectURL(u); cb(null); };
  im.src = u;
}
function addPhotos(files){
  var list = [].slice.call(files).filter(function(f){ return /^image\//.test(f.type); });
  if (!list.length) return;
  document.getElementById('pstat').innerHTML = 'Reading ' + list.length + ' photo(s)\u2026';
  var done = 0;
  list.forEach(function(f){
    exifr.parse(f, {gps:true, tiff:true, ifd0:true, exif:true}).then(function(x){
      var lat = x && (x.latitude != null ? x.latitude : null);
      var lon = x && (x.longitude != null ? x.longitude : null);
      if (lat == null || lon == null){ noGps++; step(); return; }
      var when = (x.DateTimeOriginal || x.CreateDate || null);
      var cam = [x.Make, x.Model].filter(Boolean).join(' ') || 'unknown camera';
      var dayIdx = dayFromDate(when);
      var n, dayMatch = (dayIdx >= 0);
      if (dayMatch){
        var nd = nearestOnDay(lat, lon, dayIdx);
        n = {pt:{day:dayIdx, mile:nd.mile}, dist:nd.dist};
      } else {
        n = nearest(lat, lon);
      }
      // a photo taken on one of the tour dates is trusted; only undated strays get distance-rejected
      if (!dayMatch && n.dist > REJECT_M){
        rejected.push({name:f.name, miles:+(n.dist/1609.34).toFixed(1), reason:'no matching ride date'});
        step(); return;
      }
      if (dayMatch && n.dist > REJECT_M){
        rejected.push({name:f.name, miles:+(n.dist/1609.34).toFixed(1), reason:'right date but over '+REJECT_MI+' mi away'});
        step(); return;
      }
      var p = {name:f.name, lat:lat, lon:lon, time:when ? new Date(when).toISOString() : null,
               camera:cam, day:n.pt.day, mile:+n.pt.mile.toFixed(2), off:Math.round(n.dist),
               dayMatch:dayMatch};
      photos.push(p);
      thumb(f, function(src){
        p.thumb = src;
        var col = DAYS[p.day].color, bad = p.off > OFF_M;
        var mk = L.marker([lat,lon], {icon:L.divIcon({className:'',
          html:'<div class="pmark" style="background:'+(bad?'#b00020':col)+'"></div>',
          iconSize:[13,13], iconAnchor:[6,6]}), _photo:p, _bad:bad});
        mk.bindPopup((src?'<img class="pthumb" src="'+src+'">':'')+
          '<b>'+p.name+'</b><br>'+DAYS[p.day].title+' \u00b7 mile '+p.mile+
          '<br>'+(p.time ? new Date(p.time).toLocaleString() : 'no timestamp')+
          '<br>'+(bad ? '<span style="color:#b00020">'+(p.off>1609 ? (p.off/1609.34).toFixed(1)+' mi' : p.off+' m')+' off the planned route</span>'
                      : p.off+' m from route')+
          (p.dayMatch ? '<br><span style="color:#2e8b57">\u2713 taken on this day\u2019s date</span>'
                      : '<br><span style="opacity:.6">date does not match a ride day</span>')+
          '<br><span style="opacity:.6">'+p.camera+'</span>');
        mk.addTo(photoLayer);
        step();
      });
    }).catch(function(){ noGps++; step(); });
    function step(){ if (++done === list.length) render(); }
  });
}
function deviations(){
  var off = photos.filter(function(p){ return p.off > OFF_M && p.time; })
                  .sort(function(a,b){ return new Date(a.time) - new Date(b.time); });
  var groups = [];
  off.forEach(function(p){
    var g = groups[groups.length-1];
    if (g){
      var last = g.items[g.items.length-1];
      var gapM = hav([last.lat,last.lon],[p.lat,p.lon]);
      var gapMin = Math.abs(new Date(p.time) - new Date(last.time))/60000;
      if (g.day === p.day && gapM < CL_M && gapMin < CL_MIN){ g.items.push(p); return; }
    }
    groups.push({day:p.day, items:[p]});
  });
  return groups.map(function(g){
    var cams = {}; g.items.forEach(function(p){ cams[p.camera] = 1; });
    var nc = Object.keys(cams).length;
    var miles = g.items.map(function(p){ return p.mile; });
    return {day:g.day, count:g.items.length, cameras:nc,
      fromMile:Math.min.apply(null,miles), toMile:Math.max.apply(null,miles),
      avgOff:Math.round(g.items.reduce(function(a,p){return a+p.off;},0)/g.items.length),
      confirmed:(g.items.length >= 3 || nc >= 2),

      points:g.items.map(function(p){ return [p.lat, p.lon]; })};
  });
}
function render(){
  var st = document.getElementById('pstat');
  var rej = '';
  if (rejected.length){
    rej = '<div class="dev"><b>'+rejected.length+' photo(s) rejected</b> \u2014 more than '+
      REJECT_MI+' mi from any route:<br>'+
      rejected.slice(0,6).map(function(r){ return r.name+' ('+r.miles+' mi \u2013 '+(r.reason||'')+')'; }).join('<br>')+
      (rejected.length > 6 ? '<br>\u2026and '+(rejected.length-6)+' more' : '')+'</div>';
  }
  if (!photos.length){
    st.innerHTML = (noGps ? '<b>'+noGps+'</b> photo(s) had no GPS data.' : 'No photos placed.') + rej;
    return;
  }
  var perDay = DAYS.map(function(_,i){ return photos.filter(function(p){return p.day===i;}).length; });
  var offN = photos.filter(function(p){ return p.off > OFF_M; }).length;
  var h = '<b>'+photos.length+'</b> placed'+(noGps?', <b>'+noGps+'</b> without GPS':'')+'.<br>'+
    perDay.map(function(n,i){ return n ? DAYS[i].title.split(' \u00b7')[0]+': '+n : null; })
          .filter(Boolean).join(' \u00b7 ')+
    '<br><b>'+offN+'</b> more than '+OFF_M+' m off the planned line.';
  var devs = deviations();
  devs.forEach(function(d){
    var head = d.confirmed ? '<b>Rode off the planned line here</b>'
                           : 'Possibly off-line (weak evidence)';
    h += '<div class="dev'+(d.confirmed ? '' : ' ok')+'">'+ head +
      '<br>'+DAYS[d.day].title.split(' \u00b7')[0]+', mile '+d.fromMile.toFixed(1)+'\u2013'+d.toMile.toFixed(1)+
      '<br>'+d.count+' photo(s), '+d.cameras+' camera(s), avg '+d.avgOff+' m off'+
      '</div>';
  });
  if (!devs.length) h += '<div class="dev ok">No deviations detected \u2014 photos match the planned routes.</div>';
  h += '<div style="font-size:10.5px;color:var(--mut);margin-top:6px;line-height:1.4">'+
       'Photos are logged as dots only. The planned routes are fixed and are never '+
       'modified or re-drawn to include a photo position.</div>';
  st.innerHTML = h + rej;
  window.__placements = {generated:new Date().toISOString(), offRouteThresholdM:OFF_M,
                         rejectThresholdMi:REJECT_MI, rejected:rejected,
                         photos:photos, deviations:devs};
}
var LINK_BLOB = {"v": 1, "kdf": "PBKDF2-SHA256", "iter": 310000, "salt": "baOaA+L+iaOYHZt2IS+PLQ==", "iv": "7rXfmh7wgyYROeNH", "ct": "KjeixVI3A9Y0GMc4LW9IhTBJszquuOlBsoiPseup2X9gkgeu+AMmStOsPdLlt1SKOy+xLgFiS4MLYhL1VZb2UG9lFTSY4u0="};
function b64(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); }
function decryptLink(pw){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
   .then(function(base){
     return crypto.subtle.deriveKey(
       {name:'PBKDF2', salt:b64(LINK_BLOB.salt), iterations:LINK_BLOB.iter, hash:'SHA-256'},
       base, {name:'AES-GCM', length:256}, false, ['decrypt']);
   })
   .then(function(key){
     return crypto.subtle.decrypt({name:'AES-GCM', iv:b64(LINK_BLOB.iv)}, key, b64(LINK_BLOB.ct));
   })
   .then(function(buf){ return new TextDecoder().decode(buf); });
}
function unlock(url){
  document.getElementById('plock').hidden = true;
  document.getElementById('pbody').hidden = false;
  var box = document.getElementById('uplink');
  if (url && box){
    box.hidden = false;
    box.innerHTML = '<b>Upload your photos to the group folder</b><br>'+
      '<a href="'+url+'" target="_blank" rel="noopener noreferrer">'+url+'</a>'+
      '<div style="font-size:10.5px;opacity:.75;margin-top:4px">'+
      'Opens a Synology File Request \u2014 upload only, nobody can browse the folder. '+
      'Keep this link to the group.</div>';
  }
}
function tryUnlock(){
  var v = document.getElementById('ppw').value, msg = document.getElementById('pmsg');
  if (!v) { msg.textContent = 'Enter the password.'; return; }
  msg.style.color = 'var(--mut)'; msg.textContent = 'Checking\u2026';
  decryptLink(v).then(function(url){
    try { sessionStorage.setItem('photoUnlockUrl', url); } catch(e){}
    msg.textContent = ''; msg.style.color = '#b00020';
    unlock(url);
  }).catch(function(){
    msg.style.color = '#b00020';
    msg.textContent = 'Wrong password.';
  });
}
document.getElementById('pgo').addEventListener('click', tryUnlock);
document.getElementById('ppw').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryUnlock(); });
try { var su = sessionStorage.getItem('photoUnlockUrl'); if (su) unlock(su); } catch(e){}

var drop = document.getElementById('drop'), pfile = document.getElementById('pfile');
drop.addEventListener('click', function(){ pfile.click(); });
pfile.addEventListener('change', function(e){ addPhotos(e.target.files); });
['dragenter','dragover'].forEach(function(ev){
  drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('hot'); }); });
['dragleave','drop'].forEach(function(ev){
  drop.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('hot'); }); });
drop.addEventListener('drop', function(e){ addPhotos(e.dataTransfer.files); });
document.getElementById('pclear').addEventListener('click', function(){
  photos = []; noGps = 0; rejected = []; photoLayer.clearLayers(); render(); });
document.getElementById('pexport').addEventListener('click', function(){
  if (!photos.length) return;
  var b = new Blob([JSON.stringify(window.__placements, null, 2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'photo-placements.json'; a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000); });

side.addEventListener('click', function(e){
  if (e.target.id === 'allDays') { DAYS.forEach(function(_, k){ setVisible(k, true); }); return; }
  if (e.target.id === 'fitAll') { map.fitBounds(L.latLngBounds(all).pad(0.04)); return; }
  var o = e.target.getAttribute('data-o');
  if (o !== null && o !== undefined) {
    var j = +o;
    DAYS.forEach(function(_, k){ setVisible(k, k === j); });
    map.fitBounds(L.latLngBounds(DAYS[j].line).pad(0.06));
    return;
  }
  var z = e.target.getAttribute('data-z'), t = e.target.getAttribute('data-t');
  if (z !== null && z !== undefined) {
    map.fitBounds(L.latLngBounds(DAYS[+z].line).pad(0.06));
  } else if (t !== null && t !== undefined) {
    var i = +t, card = e.target.closest('.day');
    if (map.hasLayer(layers[i])) { map.removeLayer(layers[i]); e.target.textContent = 'Show'; card.classList.add('off'); }
    else { map.addLayer(layers[i]); e.target.textContent = 'Hide'; card.classList.remove('off'); }
  }
});
